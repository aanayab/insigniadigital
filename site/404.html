<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/wp-content/uploads/2026/03/Logo-ID-edited-150x150.png" sizes="32x32">
<title>Página no encontrada — Insignia Digital</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f8fa;
    color: #1f2430;
  }
  main { max-width: 34rem; text-align: center; }
  .code { font-size: 4.5rem; font-weight: 700; line-height: 1; margin: 0 0 .5rem; color: #9aa3b2; }
  h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
  p { margin: 0 0 1.75rem; line-height: 1.6; color: #4a5364; }
  a.home {
    display: inline-block;
    padding: .7rem 1.5rem;
    border-radius: 6px;
    background: #1f2430;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
  }
  a.home:hover { background: #333c4d; }
  @media (prefers-color-scheme: dark) {
    body { background: #14171d; color: #e7eaf0; }
    p { color: #a8b0be; }
    .code { color: #59616f; }
    a.home { background: #e7eaf0; color: #14171d; }
    a.home:hover { background: #c9cfda; }
  }
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Esta página no existe</h1>
    <p>La dirección que abriste no corresponde a ninguna página del sitio. Puede que el enlace esté mal escrito o que el contenido se haya movido.</p>
    <a class="home" href="/">Ir al inicio</a>
  </main>
</body>
</html>
